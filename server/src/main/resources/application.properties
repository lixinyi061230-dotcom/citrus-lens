spring.application.name=Ece
mybatis.mapper-locations=classpath:mappers/*xml
mybatis.type-aliases-package=com.example.Ece.mybatis.entity
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.name=defaultDataSource
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/yolo_detect?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
server.port=9999
file.ip=${FILE_IP:localhost}
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB



